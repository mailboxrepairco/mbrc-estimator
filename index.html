function jobStatusBadge(s){

// Resize an image client-side before upload (cheaper storage + faster uploads).
function resizeImage(file,max,quality){
return new Promise((resolve,reject)=>{
const img=new Image();
const reader=new FileReader();
reader.onload=e=>{img.src=e.target.result;};
reader.onerror=reject;
img.onload=()=>{
let w=img.width,ht=img.height;
if(w>ht){ if(w>max){ht=Math.round(ht*max/w);w=max;} }
else { if(ht>max){w=Math.round(w*max/ht);ht=max;} }
const canvas=document.createElement('canvas');
canvas.width=w;canvas.height=ht;
canvas.getContext('2d').drawImage(img,0,0,w,ht);
canvas.toBlob(b=>b?resolve(b):reject(new Error('resize failed')),'image/jpeg',quality);
};
img.onerror=reject;
reader.readAsDataURL(file);
});
}

// Upload a job photo to Storage + record a row in job_photos.
async function uploadPhoto(jobId,file,profile,phase,caption){
const blob=await resizeImage(file,1600,0.8);
const path=jobId+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
const up=await sb.storage.from('job-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
if(up.error) throw up.error;
const pub=sb.storage.from('job-photos').getPublicUrl(path);
const rec=await sb.from('job_photos').insert({
job_id:jobId,url:pub.data.publicUrl,storage_path:path,caption:caption||null,phase:phase||'progress',
uploaded_by:profile.id,uploaded_by_name:profile.name,uploaded_by_role:profile.role
}).select().single();
if(rec.error) throw rec.error;
return rec.data;
}

const sub=calcSub(form.items);
const tax=sub*(Number(form.tax_rate)||0)/100;
const total=sub+tax;

async function save(){
setSaving(true);
try{
const data={...form};
if(!data.customer_id){
const exists=customers.find(c=>c.name===data.customer_name);
if(!exists&&data.customer_name){
const {data:nc}=await sb.from('customers').insert({name:data.customer_name,phone:data.customer_phone,email:data.customer_email,address:data.customer_address}).select().single();
if(nc) data.customer_id=nc.id;

data.customer_id=exists.id;

result=await sb.from('estimates').update(data).eq('id',data.id).select().single();

function EstimateDetail({id,onBack,onEdit,onConvert}){
const [est,setEst]=useState(null);

useEffect(()=>{

const sub=calcSub(est.items||[]);

const total=sub+tax;
const shareUrl='https://mailboxrepairco.github.io/mbrc-estimator/view.html?id='+est.id;

const sendSMS=()=>window.open('sms:'+est.customer_phone+'?body=Hi '+est.customer_name+', your estimate from The Mailbox Repair CO is ready. Total: '+fmt(total)+'. View here: '+shareUrl);
const sendEmail=()=>window.open('mailto:'+est.customer_email+'?subject=Your Estimate '+est.number+' - The Mailbox Repair CO&body=Hi '+est.customer_name+',%0A%0AYour estimate is ready. Total: '+fmt(total)+'%0A%0AView here: '+shareUrl+'%0A%0AThank you!%0AThe Mailbox Repair CO');
const sendWA=()=>window.open('https://wa.me/1'+est.customer_phone.replace(/\D/g,'')+'?text=Hi '+est.customer_name+', your estimate from The Mailbox Repair CO is ready. Total: '+fmt(total)+'. View: '+shareUrl);

async function moveToJob(){
if(!await mbrcConfirm('Move this estimate to Jobs?'))return;
setMoving(true);
try{
const chk=await sb.from('jobs').select('id').eq('estimate_id',est.id).maybeSingle();
if(chk.data){await mbrcAlert('A job already exists for this estimate.');setMoving(false);return;}
const res=await sb.from('jobs').insert({estimate_id:est.id,title:(est.customer_name||'Job')+' — '+est.number,customer_name:est.customer_name,customer_phone:est.customer_phone,customer_address:est.customer_address,amount:calcTotal(est.items||[],est.tax_rate),status:'unassigned',deposit_paid:false}).select().single();
if(res.error)throw res.error;
await mbrcAlert('Job created!');
}catch(e){await mbrcAlert('Error: '+e.message);}
setMoving(false);
}
function printEst(){
const w=window.open('','_blank');
w.document.write('<html><head><title>'+est.number+'</title><style>body{font-family:Arial,sans-serif;padding:40px;max-width:700px;margin:0 auto}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px;text-align:left}th{background:#f5f5f5}.total{font-size:20px;font-weight:bold;margin-top:16px}</style></head><body>');
w.document.write('<h1>The Mailbox Repair CO</h1><p>DFW Metroplex, Texas</p><hr/>');
w.document.write('<h2>Estimate '+est.number+'</h2>');
w.document.write('<p><strong>Date:</strong> '+est.date+'<br/><strong>Status:</strong> '+est.status+'</p>');
w.document.write('<h3>Customer</h3><p>'+est.customer_name+'<br/>'+est.customer_phone+'<br/>'+est.customer_email+'<br/>'+est.customer_address+'</p>');
w.document.write('<table><tr><th>Description</th><th>Qty</th><th>Unit</th><th>Price</th><th>Total</th></tr>');
(est.items||[]).forEach(i=>w.document.write('<tr><td>'+i.description+'</td><td>'+i.qty+'</td><td>'+i.unit+'</td><td>'+fmt(i.price)+'</td><td>'+fmt((Number(i.qty)||1)*(Number(i.price)||0))+'</td></tr>'));
w.document.write('</table>');
w.document.write('<p class="total">Subtotal: '+fmt(sub)+'</p>');
if(tax>0)w.document.write('<p>Tax ('+est.tax_rate+'%): '+fmt(tax)+'</p>');
w.document.write('<p class="total">TOTAL: '+fmt(total)+'</p>');
if(est.notes)w.document.write('<h3>Notes</h3><p>'+est.notes+'</p>');
w.document.write('<br/><hr/><p>Thank you for your business!</p></body></html>');
w.document.close();w.print();
}

function InvoiceForm({invoice,estimate,onSave,onBack}){
const base=estimate?{
number:'INV-'+Date.now().toString().slice(-4),
date:today(),
due_date:'',
status:'Unpaid',
customer_name:estimate.customer_name,customer_phone:estimate.customer_phone,

payment_link:''
}:invoice;

const [form,setForm]=useState(base||{
number:'INV-'+Date.now().toString().slice(-4),date:today(),due_date:'',status:'Unpaid',
customer_name:'',customer_phone:'',customer_email:'',customer_address:'',
items:[{id:uid(),description:'',qty:1,unit:'job',price:'',notes:''}],
notes:'',tax_rate:0,payment_link:''
});
const [saving,setSaving]=useState(false);

const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
const sub=calcSub(form.items);
const tax=sub*(Number(form.tax_rate)||0)/100;
const total=sub+tax;

async function save(){
setSaving(true);
try{
let result;
if(form.id){
result=await sb.from('invoices').update(form).eq('id',form.id).select().single();
} else {
result=await sb.from('invoices').insert(form).select().single();
if(result.error) throw result.error;
if(estimate){
await sb.from('estimates').update({status:'Approved',invoice_id:result.data.id}).eq('id',estimate.id);
// Auto-create a job for this estimate (guard against duplicates).
const existing=await sb.from('jobs').select('id').eq('estimate_id',estimate.id).maybeSingle();
if(!existing.data){
await sb.from('jobs').insert({
estimate_id:estimate.id,
invoice_id:result.data.id,
title:(estimate.customer_name||'Job')+' — '+result.data.number,
customer_name:estimate.customer_name,
customer_phone:estimate.customer_phone,
customer_address:estimate.customer_address,
amount:calcTotal(estimate.items||[],estimate.tax_rate),
status:'awaiting_deposit',
deposit_paid:false
});
}
}
}
if(result.error) throw result.error;
onSave(result.data);
} catch(e){alert('Error: '+e.message);}
setSaving(false);
}

// ── REPORTS ───────────────────────────────────────────────────────────────
function Reports(){
const [data,setData]=useState(null);
const [loading,setLoading]=useState(true);

useEffect(()=>{
async function load(){
const [invs,ests,custs]=await Promise.all([
sb.from('invoices').select('*'),
sb.from('estimates').select('*'),
sb.from('customers').select('*')
]);
const paidInvs=(invs.data||[]).filter(i=>i.status==='Paid');
const unpaidInvs=(invs.data||[]).filter(i=>i.status!=='Paid');
const revenue=paidInvs.reduce((a,i)=>a+calcTotal(i.items||[],i.tax_rate),0);
const pending=unpaidInvs.reduce((a,i)=>a+calcTotal(i.items||[],i.tax_rate),0);
const months=[];
for(let i=5;i>=0;i--){
const d=new Date();d.setMonth(d.getMonth()-i);
const m=d.toISOString().slice(0,7);
const label=d.toLocaleString('default',{month:'short'});
const amt=paidInvs.filter(inv=>inv.created_at&&inv.created_at.startsWith(m)).reduce((a,inv)=>a+calcTotal(inv.items||[],inv.tax_rate),0);
months.push({label,amt});
}
const custRev={};
paidInvs.forEach(i=>{if(i.customer_name)custRev[i.customer_name]=(custRev[i.customer_name]||0)+calcTotal(i.items||[],i.tax_rate)});
const topCustomers=Object.entries(custRev).sort((a,b)=>b[1]-a[1]).slice(0,5);
const srcMap={};
(custs.data||[]).forEach(c=>{if(c.lead_source)srcMap[c.lead_source]=(srcMap[c.lead_source]||0)+1});
const leadSources=Object.entries(srcMap).sort((a,b)=>b[1]-a[1]);
setData({revenue,pending,months,topCustomers,leadSources,totalInvoices:(invs.data||[]).length,totalEstimates:(ests.data||[]).length,totalCustomers:(custs.data||[]).length});
setLoading(false);
}
load();
},[]);

if(loading) return h('div',{className:'content'},h('div',{className:'loading'},'Loading...'));
if(!data) return null;

const maxAmt=Math.max(...data.months.map(m=>m.amt),1);

return h('div',{className:'content'},
h('h2',{className:'section-title',style:{marginBottom:12}},'Revenue Reports'),
h('div',{className:'stats-grid'},
h('div',{className:'stat-box'},h('div',{className:'stat-num',style:{fontSize:16}},fmt(data.revenue)),h('div',{className:'stat-label'},'Total Revenue')),
h('div',{className:'stat-box'},h('div',{className:'stat-num',style:{fontSize:16,color:'#ea580c'}},fmt(data.pending)),h('div',{className:'stat-label'},'Pending')),
h('div',{className:'stat-box'},h('div',{className:'stat-num'},data.totalInvoices),h('div',{className:'stat-label'},'Invoices')),
h('div',{className:'stat-box'},h('div',{className:'stat-num'},data.totalCustomers),h('div',{className:'stat-label'},'Customers'))
),
h('div',{className:'card'},
h('div',{className:'card-title'},'Monthly Revenue (6 mo)'),
h('div',{className:'chart-bar-wrap'},
data.months.map(m=>h('div',{key:m.label,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center'}},
h('div',{style:{width:'100%',background:'#2563eb',borderRadius:'4px 4px 0 0',height:Math.max((m.amt/maxAmt)*70,2)+'px'}}),
h('div',{className:'chart-label'},m.label),
h('div',{style:{fontSize:9,color:'#2563eb',textAlign:'center'}},m.amt>0?'$'+Math.round(m.amt):'')
))
)
),
data.topCustomers.length>0&&h('div',{className:'card'},
h('div',{className:'card-title'},'Top Customers'),
data.topCustomers.map(([name,amt])=>h('div',{key:name,style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #e6ecf5'}},
h('div',{style:{fontSize:13}},name),
h('div',{style:{fontSize:13,color:'#047857',fontWeight:600}},fmt(amt))
))
),
data.leadSources.length>0&&h('div',{className:'card'},
h('div',{className:'card-title'},'Lead Sources'),
data.leadSources.map(([src,cnt])=>h('div',{key:src,style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #e6ecf5'}},
h('div',{style:{fontSize:13}},src),
h('div',{style:{fontSize:13,color:'#1d4ed8',fontWeight:600}},cnt+' leads')
))
)
);
}

async function submit(){
if(!email||!pw){setMsg('Enter email and password.');return;}
setBusy(true);setMsg('');
try{
if(mode==='signin'){
const r=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
if(r.error)throw r.error;
} else {
const r=await sb.auth.signUp({email:email.trim(),password:pw,options:{data:{name:name.trim()}}});
if(r.error)throw r.error;
if(r.data.session){ /* logged in immediately */ }
else { setMsg('Account created. If email confirmation is on, check your inbox, then sign in.'); setMode('signin'); }

}catch(e){setMsg(e.message);}

// ── JOB DETAIL ────────────────────────────────────────────────────────────
function JobDetail({id,profile,onBack}){
const [job,setJob]=useState(null);
const [photos,setPhotos]=useState([]);
const [crew,setCrew]=useState([]);
const [loading,setLoading]=useState(true);
const [phase,setPhase]=useState('progress');
const [caption,setCaption]=useState('');
const [uploading,setUploading]=useState(false);
const fileRef=useRef(null);
const isMgr=profile.role==='owner'||profile.role==='manager';

function refreshJob(){sb.from('jobs').select('*').eq('id',id).single().then(r=>setJob(r.data));}
function refreshPhotos(){sb.from('job_photos').select('*').eq('job_id',id).order('created_at',{ascending:false}).then(r=>setPhotos(r.data||[]));}

useEffect(()=>{
sb.from('jobs').select('*').eq('id',id).single().then(r=>{setJob(r.data);setLoading(false)});
refreshPhotos();
if(isMgr) sb.from('profiles').select('*').order('name').then(r=>setCrew(r.data||[]));
},[id]);

if(loading||!job) return h('div',{className:'content'},h('div',{className:'loading'},'Loading...'));

async function toggleDeposit(){
const paid=!job.deposit_paid;
const newStatus=paid?(job.status==='awaiting_deposit'?'unassigned':job.status):'awaiting_deposit';
await sb.from('jobs').update({deposit_paid:paid,status:newStatus}).eq('id',id);
refreshJob();
}
async function assignTo(personId){
if(!personId)return;
const person=crew.find(c=>c.id===personId);
await sb.from('jobs').update({assigned_to:personId,assigned_to_name:person?person.name:null,assigned_by:profile.id,assigned_at:new Date().toISOString(),status:'assigned'}).eq('id',id);
refreshJob();
}
async function setStatus(s){await sb.from('jobs').update({status:s}).eq('id',id);refreshJob();}
async function setSchedule(d){await sb.from('jobs').update({scheduled_date:d||null}).eq('id',id);refreshJob();}

async function onFile(e){
const file=e.target.files&&e.target.files[0];
if(!file)return;
setUploading(true);
try{
await uploadPhoto(id,file,profile,phase,caption);
setCaption('');
refreshPhotos();
}catch(err){alert('Upload failed: '+err.message);}
setUploading(false);
if(fileRef.current)fileRef.current.value='';
}
async function delPhoto(p){
if(!confirm('Delete this photo?'))return;
try{
if(p.storage_path) await sb.storage.from('job-photos').remove([p.storage_path]);
await sb.from('job_photos').delete().eq('id',p.id);
refreshPhotos();
}catch(err){alert('Delete failed: '+err.message);}
}

const canUpload=isMgr||job.assigned_to===profile.id;

return h('div',{className:'content'},
h('div',{className:'section-header'},
h('button',{className:'btn btn-ghost btn-sm',onClick:onBack},'← Back'),
jobStatusBadge(job.status)
),
h('div',{className:'card'},
h('h2',{style:{fontSize:18,fontWeight:700}},job.title||job.customer_name||'Job'),
job.customer_name&&h('div',{style:{fontSize:13,color:'#64748b',marginTop:4}},job.customer_name),
job.customer_phone&&h('div',{style:{fontSize:13,color:'#64748b'}},job.customer_phone),
job.customer_address&&h('div',{style:{fontSize:13,color:'#64748b'}},job.customer_address),
h('div',{style:{fontSize:18,fontWeight:700,color:'#047857',marginTop:8}},fmt(job.amount))
),

isMgr&&h('div',{className:'card'},
h('div',{className:'card-title'},'Job Management'),
h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}},
h('div',{style:{fontSize:14}},'Deposit paid'),
h('button',{className:'btn btn-sm '+(job.deposit_paid?'btn-success':'btn-ghost'),onClick:toggleDeposit},job.deposit_paid?'✓ Paid':'Mark Paid')
),
job.deposit_paid?h('div',{className:'form-group'},
h('label',{className:'label'},'Assign to'),
h('select',{className:'input',value:job.assigned_to||'',onChange:e=>assignTo(e.target.value)},
h('option',{value:''},'— Select crew —'),
crew.map(c=>h('option',{key:c.id,value:c.id},(c.name||'(no name)')+' ('+c.role+')'))
)
):h('div',{className:'alert alert-warn'},'Mark the deposit paid to assign this job.'),
h('div',{className:'form-group'},
h('label',{className:'label'},'Scheduled date'),
h('input',{className:'input',type:'date',value:job.scheduled_date||'',onChange:e=>setSchedule(e.target.value)})
),
h('div',{className:'form-group'},
h('label',{className:'label'},'Status'),
h('select',{className:'input',value:job.status,onChange:e=>setStatus(e.target.value)},
['awaiting_deposit','unassigned','assigned','in_progress','complete'].map(s=>h('option',{key:s,value:s},s))
)
)
),

!isMgr&&job.assigned_to===profile.id&&h('div',{className:'card'},
h('div',{className:'card-title'},'Update Status'),
h('div',{style:{display:'flex',gap:6}},
h('button',{className:'btn btn-sm '+(job.status==='in_progress'?'btn-primary':'btn-ghost'),style:{flex:1},onClick:()=>setStatus('in_progress')},'Start'),
h('button',{className:'btn btn-sm '+(job.status==='complete'?'btn-success':'btn-ghost'),style:{flex:1},onClick:()=>setStatus('complete')},'Complete')
)
),

h('div',{className:'card'},
h('div',{className:'card-title'},'Photos ('+photos.length+')'),
canUpload&&h('div',{style:{marginBottom:12}},
h('div',{style:{display:'flex',gap:4,marginBottom:8}},
['before','progress','after'].map(ph=>h('button',{key:ph,className:'btn btn-sm '+(phase===ph?'btn-primary':'btn-ghost'),onClick:()=>setPhase(ph),style:{flex:1}},ph.charAt(0).toUpperCase()+ph.slice(1)))
),
h('input',{className:'input',placeholder:'Caption (optional)',value:caption,onChange:e=>setCaption(e.target.value),style:{marginBottom:8}}),
h('input',{ref:fileRef,type:'file',accept:'image/*',capture:'environment',onChange:onFile,style:{display:'none'}}),
h('button',{className:'btn btn-primary btn-block',onClick:()=>fileRef.current&&fileRef.current.click(),disabled:uploading},uploading?'Uploading...':'📷 Add Photo ('+phase+')')
),
photos.length===0?h('div',{className:'empty',style:{padding:'20px'}},h('div',{className:'empty-icon'},'📷'),h('div',null,'No photos yet')):
h('div',{className:'photo-grid'},
photos.map(p=>h('div',{key:p.id,className:'photo-card'},
h('span',{className:'photo-phase'},p.phase),
h('img',{src:p.url,alt:p.caption||'',loading:'lazy'}),
h('div',{className:'photo-meta'},
(p.caption?p.caption+' · ':'')+(p.uploaded_by_name||''),
(isMgr||p.uploaded_by===profile.id)&&h('button',{className:'btn btn-danger btn-sm',style:{marginTop:4,padding:'2px 8px'},onClick:()=>delPhoto(p)},'Delete')
)
))
)
)
);
}

// ── TEAM (owner only) ─────────────────────────────────────────────────────
function Team({profile}){
const [people,setPeople]=useState([]);
const [loading,setLoading]=useState(true);

function load(){sb.from('profiles').select('*').order('name').then(r=>{setPeople(r.data||[]);setLoading(false)});}
useEffect(()=>{load()},[]);

async function setRole(pid,role){await sb.from('profiles').update({role}).eq('id',pid);load();}

if(loading) return h('div',{className:'content'},h('div',{className:'loading'},'Loading...'));

return h('div',{className:'content'},
h('div',{className:'section-header'},h('h2',{className:'section-title'},'Team')),
h('div',{className:'alert alert-info'},'New sign-ups start as Crew. Promote people to Manager or Owner here.'),
people.map(p=>h('div',{key:p.id,className:'list-item',style:{cursor:'default'}},
h('div',null,
h('div',{className:'list-item-title'},p.name||'(no name)'),
p.phone&&h('div',{className:'list-item-sub'},p.phone)
),
h('div',null,
h('select',{className:'input',value:p.role,onChange:e=>setRole(p.id,e.target.value),style:{width:130}},
['crew','manager','owner'].map(r=>h('option',{key:r,value:r},r))
)
)
))
);
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App({profile,onLogout}){
const isMgr=profile.role==='owner'||profile.role==='manager';
const [tab,setTab]=useState(isMgr?'dashboard':'jobs');
const [view,setView]=useState(null);

const navigate=(screen,data)=>{
if(screen==='new-estimate'){setView({type:'new-estimate'});return}
setTab(screen);setView(null);
};

if(view){
if(view.type==='new-estimate')
return h('div',{className:'app'},
h(EstimateForm,{onSave:(est)=>{setView({type:'estimate-detail',id:est.id})},onBack:()=>setView(null)})
);
if(view.type==='edit-estimate')
return h('div',{className:'app'},
h(EstimateForm,{estimate:view.data,onSave:(est)=>{setView({type:'estimate-detail',id:est.id})},onBack:()=>setView(null)})
);
if(view.type==='estimate-detail')
return h('div',{className:'app'},
h(EstimateDetail,{
id:view.id,
onBack:()=>setView(null),
onEdit:()=>{
sb.from('estimates').select('*').eq('id',view.id).single().then(r=>{
if(r.data)setView({type:'edit-estimate',data:r.data});
});
},
onConvert:(est)=>setView({type:'new-invoice',data:est})
})
);
if(view.type==='new-invoice')
return h('div',{className:'app'},
h(InvoiceForm,{estimate:view.data,onSave:(inv)=>{setView({type:'invoice-detail',id:inv.id})},onBack:()=>setView(null)})
);
if(view.type==='edit-invoice')
return h('div',{className:'app'},
h(InvoiceForm,{invoice:view.data,onSave:(inv)=>{setView({type:'invoice-detail',id:inv.id})},onBack:()=>setView(null)})
);
if(view.type==='invoice-detail')
return h('div',{className:'app'},
h(InvoiceDetail,{
id:view.id,
onBack:()=>setView(null),
onEdit:()=>{
sb.from('invoices').select('*').eq('id',view.id).single().then(r=>{
if(r.data)setView({type:'edit-invoice',data:r.data});
});
}
})
);
if(view.type==='job-detail')
return h('div',{className:'app'},
h(JobDetail,{id:view.id,profile,onBack:()=>setView(null)})
);
}

const allTabs=[
{id:'dashboard',label:'🏠 Home',roles:['owner','manager']},
{id:'estimates',label:'📋 Estimates',roles:['owner','manager']},
{id:'invoices',label:'🧾 Invoices',roles:['owner','manager']},
{id:'customers',label:'👥 Customers',roles:['owner','manager']},
{id:'jobs',label:'🔧 Jobs',roles:['owner','manager','crew']},
{id:'reports',label:'📊 Reports',roles:['owner','manager']},
{id:'pricelist',label:'💲 Prices',roles:['owner','manager']},
{id:'team',label:'🛡️ Team',roles:['owner']},
];
const tabs=allTabs.filter(t=>t.roles.includes(profile.role));

return h('div',{className:'app'},
h('nav',{className:'nav'},
h('div',{className:'nav-top'},
h('div',{className:'nav-logo'},'MBRC',h('span',null,'The Mailbox Repair CO')),
h('div',{style:{display:'flex',alignItems:'center',gap:8}},
h('span',{className:'role-pill'},profile.role),
h('button',{className:'btn btn-ghost btn-sm',onClick:onLogout},'Logout')
)
),
h('div',{className:'nav-tabs'},
tabs.map(t=>h('button',{key:t.id,className:'nav-tab'+(tab===t.id?' active':''),onClick:()=>{setTab(t.id);setView(null)}},t.label))
)
),
tab==='dashboard'&&isMgr&&h(Dashboard,{onNav:navigate}),
tab==='estimates'&&isMgr&&h(EstimatesList,{onNew:()=>setView({type:'new-estimate'}),onSelect:(id)=>setView({type:'estimate-detail',id})}),
tab==='invoices'&&isMgr&&h(InvoicesList,{onNew:()=>setView({type:'new-invoice',data:null}),onSelect:(id)=>setView({type:'invoice-detail',id})}),
tab==='customers'&&isMgr&&h(Customers,null),
tab==='jobs'&&h(JobsList,{profile,onSelect:(id)=>setView({type:'job-detail',id})}),
tab==='reports'&&isMgr&&h(Reports,null),
tab==='pricelist'&&isMgr&&h(PriceListManager,null),
tab==='team'&&profile.role==='owner'&&h(Team,{profile})
);
}

// ── AUTH GATE ─────────────────────────────────────────────────────────────
function AuthGate(){
const [session,setSession]=useState(null);
const [profile,setProfile]=useState(null);
const [loading,setLoading]=useState(true);

useEffect(()=>{
let active=true;
async function loadProfile(user){
try{const r=await sb.from('profiles').select('*').eq('id',user.id).single();if(r.data)return r.data;}catch(e){}
return {id:user.id,name:(user.email||'User').split('@')[0],email:user.email||'',role:'owner',company:'The Mailbox Repair CO'};
}
sb.auth.getSession().then(async ({data})=>{
if(!active)return;
if(data.session){
setSession(data.session);
const p=await loadProfile(data.session.user);
if(active)setProfile(p);
}
if(active)setLoading(false);
});
const {data:listener}=sb.auth.onAuthStateChange(async (_e,sess)=>{
setSession(sess);
if(sess){
const p=await loadProfile(sess.user);
setProfile(p);
} else {
setProfile(null);
}
});
return ()=>{active=false;listener.subscription.unsubscribe();};
},[]);

if(loading) return h('div',{className:'loading'},'Loading...');
if(!session) return h(Login,null);
if(!profile) return h('div',{className:'loading'},'Setting up your profile…');
return h(App,{profile,onLogout:()=>sb.auth.signOut()});
}

ReactDOM.createRoot(document.getElementById('root')).render(h(AuthGate,null));
</script>
