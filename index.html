// A localStorage-backed stand-in for the Supabase JS client. It supports the
// exact chain the app uses (select/insert/update/delete/eq/order/single/
// maybeSingle/then) plus auth + a stub storage bucket, so all ~56 sb.* call
// sites work unchanged with zero setup. The seed below loads The Mailbox
// Repair Co. so a contractor can watch a lead become a paid, 5-star job.
function buildDemoClient(){
  const KEY = t => 'cl_demo_' + t;
  const load = t => { try { return JSON.parse(localStorage.getItem(KEY(t)) || '[]'); } catch(e){ return []; } };
  const save = (t,rows) => localStorage.setItem(KEY(t), JSON.stringify(rows));
  const genId = () => 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  const clone = r => JSON.parse(JSON.stringify(r));

  class QB {
    constructor(table){ this.table=table; this._op='select'; this._filters=[]; this._order=null; this._payload=null; this._single=false; this._maybe=false; }
    select(){ if(this._op!=='insert'&&this._op!=='update'&&this._op!=='delete') this._op='select'; return this; }
    insert(payload){ this._op='insert'; this._payload=payload; return this; }
    update(payload){ this._op='update'; this._payload=payload; return this; }
    delete(){ this._op='delete'; return this; }
    eq(col,val){ this._filters.push([col,val]); return this; }
    order(col,opts){ this._order=[col,(opts&&opts.ascending===false)?-1:1]; return this; }
    single(){ this._single=true; return this; }
    maybeSingle(){ this._maybe=true; return this; }
    _match(row){ return this._filters.every(([c,v]) => row[c]===v); }
    _run(){
      let rows = load(this.table);
      try {
        if(this._op==='insert'){
          const items = Array.isArray(this._payload)?this._payload:[this._payload];
          const added = items.map(it => Object.assign({ id: it.id||genId(), created_at: new Date().toISOString() }, it));
          rows = rows.concat(added); save(this.table, rows);
          return { data: this._single? clone(added[0]) : added.map(clone), error:null };
        }
        if(this._op==='update'){
          const out=[];
          rows = rows.map(r => { if(this._match(r)){ const u=Object.assign({}, r, this._payload); out.push(u); return u; } return r; });
          save(this.table, rows);
          return { data: this._single? (out[0]?clone(out[0]):null) : out.map(clone), error:null };
        }
        if(this._op==='delete'){
          rows = rows.filter(r => !this._match(r)); save(this.table, rows);
          return { data:[], error:null };
        }
        // select
        let res = rows.filter(r => this._match(r));
        if(this._order){ const [c,dir]=this._order; res=res.slice().sort((a,b)=> (a[c]>b[c]?1:a[c]<b[c]?-1:0)*dir); }
        if(this._single){ return res[0]? {data:clone(res[0]),error:null} : {data:null,error:{message:'no rows'}}; }
        if(this._maybe){ return {data: res[0]?clone(res[0]):null, error:null}; }
        return { data: res.map(clone), error:null };
      } catch(e){ return { data:null, error:{ message: e.message } }; }
    }
    then(resolve,reject){ try { return Promise.resolve(this._run()).then(resolve,reject); } catch(e){ return Promise.reject(e).then(resolve,reject); } }
  }

  const SESSION_KEY='cl_demo_session';
  const demoUser={ id:'demo-owner', email:'jr@mailboxrepairco.com' };
  let authCb=null;
  const auth = {
    async getSession(){
      const on = localStorage.getItem(SESSION_KEY)!=='out';
      return { data:{ session: on? { user: demoUser } : null }, error:null };
    },
    onAuthStateChange(cb){ authCb=cb; return { data:{ subscription:{ unsubscribe(){ authCb=null; } } } }; },
    async signInWithPassword(){ localStorage.setItem(SESSION_KEY,'in'); if(authCb) authCb('SIGNED_IN',{user:demoUser}); return { data:{ user:demoUser, session:{user:demoUser} }, error:null }; },
    async signUp(){ localStorage.setItem(SESSION_KEY,'in'); if(authCb) authCb('SIGNED_IN',{user:demoUser}); return { data:{ user:demoUser, session:{user:demoUser} }, error:null }; },
    async signOut(){ localStorage.setItem(SESSION_KEY,'out'); if(authCb) authCb('SIGNED_OUT',null); return { error:null }; }
  };

  const storage = { from(){ return {
    async upload(){ return { data:{ path:'demo' }, error:null }; },
    getPublicUrl(){ return { data:{ publicUrl:'https://placehold.co/600x400/ea6a1e/ffffff?text=Job+Photo' } }; }
  }; } };

  return { from: t => new QB(t), auth, storage };
}

// Resize an image client-side before upload (cheaper storage + faster uploads).
function resizeImage(file,max,quality){
return new Promise((resolve,reject)=>{
const img=new Image();
const reader=new FileReader();
reader.onload=e=>{img.src=e.target.result;};
reader.onerror=reject;
img.onload=()=>{
let w=img.width,ht=img.height;
if(w>ht){ if(w>max){ht=Math.round(ht*max/w);w=max;} }
else { if(ht>max){w=Math.round(w*max/ht);ht=max;} }
const canvas=document.createElement('canvas');
canvas.width=w;canvas.height=ht;
canvas.getContext('2d').drawImage(img,0,0,w,ht);
canvas.toBlob(b=>b?resolve(b):reject(new Error('resize failed')),'image/jpeg',quality);
};
img.onerror=reject;
reader.readAsDataURL(file);
});
}

// Upload a job photo to Storage + record a row in job_photos.
async function uploadPhoto(jobId,file,profile,phase,caption){
const blob=await resizeImage(file,1600,0.8);
const path=(CURRENT_CO||'co')+'/'+jobId+'/'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+'.jpg';
const up=await sb.storage.from('estimator-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});
if(up.error) throw up.error;
const pub=sb.storage.from('estimator-photos').getPublicUrl(path);
const rec=await sb.from('job_photos').insert({
company_id:CURRENT_CO,
job_id:jobId,url:pub.data.publicUrl,storage_path:path,caption:caption||null,phase:phase||'progress',
uploaded_by:profile.id,uploaded_by_name:profile.name,uploaded_by_role:profile.role
}).select().single();
if(rec.error) throw rec.error;
return rec.data;
}

function Reports(){
const [data,setData]=useState(null);
const [loading,setLoading]=useState(true);

useEffect(()=>{
async function load(){
const [invs,ests,custs]=await Promise.all([
sb.from('invoices').select('*'),
sb.from('estimates').select('*'),
sb.from('customers').select('*')
]);
const paidInvs=(invs.data||[]).filter(i=>i.status==='Paid');
const unpaidInvs=(invs.data||[]).filter(i=>i.status!=='Paid');
const revenue=paidInvs.reduce((a,i)=>a+calcTotal(i.items||[],i.tax_rate),0);
const pending=unpaidInvs.reduce((a,i)=>a+calcTotal(i.items||[],i.tax_rate),0);
const months=[];
for(let i=5;i>=0;i--){
const d=new Date();d.setMonth(d.getMonth()-i);
const m=d.toISOString().slice(0,7);
const label=d.toLocaleString('default',{month:'short'});

months.push({label,amt});

(custs.data||[]).forEach(c=>{if(c.lead_source)srcMap[c.lead_source]=(srcMap[c.lead_source]||0)+1});

setLoading(false);
}

function Leads(){
const [leads,setLeads]=useState([]);
const [loading,setLoading]=useState(true);
const [busy,setBusy]=useState('');
useEffect(()=>{load()},[]);
function load(){setLoading(true);sb.from('leads').select('*').order('created_at',{ascending:false}).then(r=>{setLeads(r.data||[]);setLoading(false)})}
const badge=s=>{const cls={New:'badge-sent',Contacted:'badge-draft',Qualified:'badge-approved',Converted:'badge-paid'}[s]||'badge-draft';return h('span',{className:'badge '+cls},s);};
async function setStatus(id,status){setBusy(id);try{await sb.from('leads').update({status}).eq('id',id);load();}catch(e){alert(e.message);}setBusy('');}
// Speed-to-lead: text the homeowner back the second their request lands.
function smsBody(ld){
  const co=((COMPANY&&COMPANY.name)||'us').replace(/\.+$/,'');
  const first=(ld.name||'there').split(/\s+/)[0];
  return 'Hi '+first+', this is '+co+'. Thanks for reaching out'+(ld.message?(' about "'+ld.message+'"'):'')+
    '. I can take a look â what time works best for a quick quote? Reply STOP to opt out.';
}
async function textBack(ld){
  if(!ld.phone){alert('No phone number on this lead.');return;}
  setBusy(ld.id);
  const body=smsBody(ld);
  try{
    if(DEMO_MODE||!LEAD_SMS_URL){
      await sb.from('leads').update({status:'Contacted'}).eq('id',ld.id);
      alert('â¡ Speed-to-lead (demo)\n\nWould text '+ld.phone+':\n\n'+body+'\n\nPaste your lead-intake URL + Twilio keys to send for real (see TWILIO-SETUP.md).');
    } else {
      const res=await fetch(LEAD_SMS_URL,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({messages:[{kind:'lead',to:ld.phone,body}]})});
      const out=await res.json();
      const r=(out.results&&out.results[0])||{};
      if(r.status==='error') throw new Error(r.error||'send failed');
      await sb.from('leads').update({status:'Contacted'}).eq('id',ld.id);
      alert(out.simulated?'Sent (simulated â Twilio keys not set on the server yet).':'â Texted '+ld.phone+' back.');
    }
    load();
  }catch(e){alert('Could not send: '+e.message);}
  setBusy('');
}
async function convert(ld){setBusy(ld.id);try{
await sb.from('customers').insert({company_id:CURRENT_CO,name:ld.name,phone:ld.phone,email:ld.email,address:ld.address,lead_source:ld.lead_source||'Lead',stage:'Lead',follow_up_date:null});
await sb.from('leads').update({status:'Converted'}).eq('id',ld.id);
load();

return h('div',{className:'content'},
h('div',{className:'section-header'},h('h2',{className:'section-title'},'ð¯ Leads'),
h('span',{className:'list-item-sub'},leads.filter(l=>l.status!=='Converted').length+' open')),
leads.length?leads.map(ld=>h('div',{key:ld.id,className:'card',style:{marginBottom:12}},
h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8}},
h('div',null,
h('div',{className:'list-item-title'},ld.name),
h('div',{className:'list-item-sub'},ld.phone+(ld.email?' Â· '+ld.email:'')),
ld.address&&h('div',{className:'list-item-sub'},ld.address)
),
h('div',{style:{textAlign:'right'}},badge(ld.status),ld.lead_source&&h('div',{className:'list-item-sub',style:{marginTop:4}},'via '+ld.lead_source))
),

h('div',{style:{display:'flex',gap:8,marginTop:12,flexWrap:'wrap'}},
ld.status==='New'&&h('button',{className:'btn btn-primary btn-sm',disabled:busy===ld.id,onClick:()=>textBack(ld)},busy===ld.id?'...':'â¡ Text back now'),
ld.status==='New'&&h('button',{className:'btn btn-ghost btn-sm',disabled:busy===ld.id,onClick:()=>setStatus(ld.id,'Contacted')},'Mark Contacted'),
(ld.status==='New'||ld.status==='Contacted')&&h('button',{className:'btn btn-ghost btn-sm',disabled:busy===ld.id,onClick:()=>setStatus(ld.id,'Qualified')},'Mark Qualified'),
ld.status!=='Converted'&&h('button',{className:'btn btn-primary btn-sm',disabled:busy===ld.id,onClick:()=>convert(ld)},busy===ld.id?'...':'Convert to Customer â')

function AuthGate(){
const [session,setSession]=useState(null);
const [profile,setProfile]=useState(null);
const [company,setCompany]=useState(null);
const [loading,setLoading]=useState(true);

async function loadProfile(userId){
const r=await sb.from('profiles').select('*').eq('id',userId).single();
const p=r.data;
let co=null;
if(p&&p.company_id){
const cr=await sb.from('companies').select('*').eq('id',p.company_id).single();
co=cr.data;
}
applyBranding(co);
return {p,co};
}

useEffect(()=>{
let active=true;
sb.auth.getSession().then(async ({data})=>{
if(!active)return;
if(data.session){
setSession(data.session);
const {p,co}=await loadProfile(data.session.user.id);
if(active){setProfile(p);setCompany(co);}
}
if(active)setLoading(false);
});
const {data:listener}=sb.auth.onAuthStateChange(async (_e,sess)=>{
setSession(sess);
if(sess){
const {p,co}=await loadProfile(sess.user.id);
setProfile(p);setCompany(co);
} else {
setProfile(null);setCompany(null);applyBranding(null);
}
});
return ()=>{active=false;listener.subscription.unsubscribe();};
},[]);

if(loading) return h('div',{className:'loading'},'Loading...');
if(!session) return h(Login,null);
if(!profile) return h('div',{className:'loading'},'Setting up your profileâ¦');
// Signed in but not attached to a company (bad/blank company code at signup,
// and not the platform owner) â block until an admin fixes it.
if(!profile.company_id && !profile.is_platform)
return h('div',{className:'login-wrap'},h('div',{className:'login-card'},
h('div',{className:'login-logo'},'Estimator'),
h('div',{className:'alert alert-info',style:{marginTop:12}},'Your account isnât linked to a company yet. Ask your admin for the correct company code, then sign up again â or have them add you.'),
