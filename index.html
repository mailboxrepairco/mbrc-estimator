<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="MBRC Estimator"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0d1626"/>
<title>MBRC Estimator | The Mailbox Repair CO</title>
<link rel="manifest" href="manifest.json"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1626;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
#root{min-height:100vh}
.app{display:flex;flex-direction:column;min-height:100vh}
/* NAV */
.nav{background:#111827;border-bottom:1px solid #1e3a5f;padding:0;position:sticky;top:0;z-index:100}
.nav-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.nav-logo{font-size:18px;font-weight:700;color:#3b82f6;letter-spacing:-0.5px}
.nav-logo span{color:#e2e8f0;font-size:11px;display:block;font-weight:400;letter-spacing:0}
.nav-tabs{display:flex;overflow-x:auto;gap:0;border-top:1px solid #1e3a5f;scrollbar-width:none}
.nav-tabs::-webkit-scrollbar{display:none}
.nav-tab{flex:0 0 auto;padding:10px 14px;font-size:12px;font-weight:500;color:#64748b;border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .2s}
.nav-tab.active{color:#3b82f6;border-bottom-color:#3b82f6}
/* CONTENT */
.content{flex:1;padding:16px;max-width:600px;margin:0 auto;width:100%}
/* CARDS */
.card{background:#111827;border:1px solid #1e3a5f;border-radius:12px;padding:16px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:all .15s;text-decoration:none;min-height:40px}
.btn-primary{background:#2563eb;color:#fff}
.btn-primary:active{background:#1d4ed8}
.btn-success{background:#059669;color:#fff}
.btn-danger{background:#dc2626;color:#fff}
.btn-ghost{background:transparent;color:#94a3b8;border:1px solid #1e3a5f}
.btn-sm{padding:6px 12px;font-size:12px;min-height:32px}
.btn-block{width:100%;display:flex}
/* INPUTS */
.input{width:100%;background:#0d1626;border:1px solid #1e3a5f;border-radius:8px;padding:10px 12px;color:#e2e8f0;font-size:14px;outline:none;transition:border .15s}
.input:focus{border-color:#3b82f6}
.input::placeholder{color:#475569}
.label{display:block;font-size:12px;color:#64748b;margin-bottom:4px;font-weight:500}
.form-group{margin-bottom:12px}
/* BADGES */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600}
.badge-draft{background:#1e293b;color:#64748b}
.badge-sent{background:#1e3a5f;color:#60a5fa}
.badge-approved{background:#052e16;color:#34d399}
.badge-declined{background:#3b0f0f;color:#f87171}
.badge-unpaid{background:#3b1f00;color:#fb923c}
.badge-paid{background:#052e16;color:#34d399}
.badge-overdue{background:#3b0f0f;color:#f87171}
/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-box{background:#111827;border:1px solid #1e3a5f;border-radius:10px;padding:14px;text-align:center}
.stat-num{font-size:24px;font-weight:700;color:#3b82f6}
.stat-label{font-size:11px;color:#64748b;margin-top:2px}
/* LIST ITEMS */
.list-item{background:#111827;border:1px solid #1e3a5f;border-radius:10px;padding:14px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;display:flex;justify-content:space-between;align-items:flex-start}
.list-item:active{border-color:#3b82f6}
.list-item-title{font-size:14px;font-weight:600;color:#e2e8f0}
.list-item-sub{font-size:12px;color:#64748b;margin-top:2px}
.list-item-amount{font-size:16px;font-weight:700;color:#34d399;text-align:right}
/* LINE ITEMS */
.line-item-row{display:grid;grid-template-columns:1fr 60px 70px 80px 32px;gap:6px;align-items:center;margin-bottom:6px}
/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;align-items:flex-end}
.modal{background:#111827;border-radius:20px 20px 0 0;padding:20px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:18px;font-weight:700;margin-bottom:16px;color:#e2e8f0}
/* ALERT */
.alert{padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:12px}
.alert-info{background:#1e3a5f;color:#60a5fa;border:1px solid #2563eb}
.alert-success{background:#052e16;color:#34d399;border:1px solid #059669}
.alert-warn{background:#3b2000;color:#fb923c;border:1px solid #92400e}
/* TABS */
.tab-bar{display:flex;gap:4px;margin-bottom:16px;background:#0d1626;border-radius:10px;padding:4px}
.tab-btn{flex:1;padding:8px;font-size:12px;font-weight:500;border:none;border-radius:7px;cursor:pointer;background:none;color:#64748b;transition:all .15s}
.tab-btn.active{background:#1e3a5f;color:#e2e8f0}
/* DIVIDER */
.divider{height:1px;background:#1e3a5f;margin:12px 0}
/* SIGNATURE */
canvas{border:1px solid #1e3a5f;border-radius:8px;width:100%;touch-action:none}
/* SEND OPTIONS */
.send-option{display:flex;align-items:center;gap:12px;padding:14px;background:#0d1626;border:1px solid #1e3a5f;border-radius:10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.send-option:active{border-color:#3b82f6}
.send-icon{font-size:24px}
.send-label{font-size:14px;font-weight:600;color:#e2e8f0}
.send-sub{font-size:11px;color:#64748b}
/* SECTION HEADER */
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title{font-size:16px;font-weight:700;color:#e2e8f0}
/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:#475569}
.empty-icon{font-size:40px;margin-bottom:12px}
/* LOADING */
.loading{text-align:center;padding:40px;color:#475569}
/* PRINT */
@media print{.nav,.btn{display:none}}
/* PIPELINE */
.pipeline-stage{margin-bottom:16px}
.stage-label{font-size:11px;font-weight:600;color:#64748b;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.stage-dot{width:8px;height:8px;border-radius:50%}
/* CHART */
.chart-bar-wrap{display:flex;align-items:flex-end;gap:4px;height:80px;margin-top:8px}
.chart-bar{flex:1;border-radius:4px 4px 0 0;background:#2563eb;min-width:0;transition:height .3s}
.chart-label{font-size:9px;color:#475569;text-align:center;margin-top:4px}
/* FOLLOW-UP ALERT */
.followup-alert{background:#3b1f00;border:1px solid #92400e;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12px;color:#fb923c}
</style>
</head>
<body>
<div id="root"><div class="loading">Loading MBRC Estimator...</div></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
'use strict';
const {useState,useEffect,useRef,useCallback} = React;
const h = React.createElement;

// ── SUPABASE ──────────────────────────────────────────────────────────────
const SB_URL = 'https://zzaiqaknjvueytymqeul.supabase.co';
const SB_KEY = 'sb_publishable_pI7rLourJP2DCzX2oFzd8w__ncNr2ri';
const sb = supabase.createClient(SB_URL, SB_KEY);

// ── HELPERS ───────────────────────────────────────────────────────────────
const fmt = n => '$' + (Number(n)||0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
const today = () => new Date().toISOString().split('T')[0];
const uid = () => Math.random().toString(36).slice(2,10);
const calcTotal = (items,tax) => {
  const sub = items.reduce((a,i)=>(a+(Number(i.qty)||1)*(Number(i.price)||0)),0);
  return sub*(1+(Number(tax)||0)/100);
};
const calcSub = items => items.reduce((a,i)=>(a+(Number(i.qty)||1)*(Number(i.price)||0)),0);

function statusBadge(s){
  const cls={Draft:'badge-draft',Sent:'badge-sent',Approved:'badge-approved',Declined:'badge-declined',
    Unpaid:'badge-unpaid',Paid:'badge-paid',Overdue:'badge-overdue'}[s]||'badge-draft';
  return h('span',{className:'badge '+cls},s);
}

// ── DEFAULT PRICE LIST ────────────────────────────────────────────────────
const DEFAULT_PRICES = [
  {id:uid(),description:'Mailbox Post Repair',unit:'job',price:150},
  {id:uid(),description:'Mailbox Post Replacement',unit:'job',price:350},
  {id:uid(),description:'Mailbox Unit Replacement',unit:'ea',price:200},
  {id:uid(),description:'Full Mailbox System Replacement',unit:'job',price:550},
  {id:uid(),description:'Cluster Box Unit (CBU) Repair',unit:'job',price:450},
  {id:uid(),description:'Concrete Base Repair',unit:'job',price:250},
  {id:uid(),description:'Painting/Refinishing',unit:'job',price:125},
  {id:uid(),description:'Emergency Service Fee',unit:'ea',price:75},
];

// ── DASHBOARD ─────────────────────────────────────────────────────────────
function Dashboard({onNav}){
  const [stats,setStats]=useState({estimates:0,invoices:0,customers:0,revenue:0,pending:0,followups:[]});
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    async function load(){
      const [ests,invs,custs]=await Promise.all([
        sb.from('estimates').select('id,status,items,tax_rate'),
        sb.from('invoices').select('id,status,items,tax_rate,due_date'),
        sb.from('customers').select('id,follow_up_date,name')
      ]);
      const revenue=(invs.data||[]).filter(i=>i.status==='Paid').reduce((a,i)=>a+calcTotal(i.items||[],i.tax_rate),0);
      const pending=(invs.data||[]).filter(i=>i.status==='Unpaid'||i.status==='Overdue').reduce((a,i)=>a+calcTotal(i.items||[],i.tax_rate),0);
      const todayStr=today();
      const followups=(custs.data||[]).filter(c=>c.follow_up_date&&c.follow_up_date<=todayStr);
      setStats({estimates:(ests.data||[]).length,invoices:(invs.data||[]).length,customers:(custs.data||[]).length,revenue,pending,followups});
      setLoading(false);
    }
    load();
  },[]);

  if(loading) return h('div',{className:'content'},h('div',{className:'loading'},'Loading...'));

  return h('div',{className:'content'},
    stats.followups.length>0 && h('div',null,
      stats.followups.map(f=>h('div',{key:f.id,className:'followup-alert'},'📅 Follow-up due: '+f.name))
    ),
    h('div',{className:'stats-grid'},
      h('div',{className:'stat-box'},h('div',{className:'stat-num'},stats.estimates),h('div',{className:'stat-label'},'Estimates')),
      h('div',{className:'stat-box'},h('div',{className:'stat-num'},stats.invoices),h('div',{className:'stat-label'},'Invoices')),
      h('div',{className:'stat-box'},h('div',{className:'stat-num stat-num',style:{fontSize:'18px'}},fmt(stats.revenue)),h('div',{className:'stat-label'},'Revenue')),
      h('div',{className:'stat-box'},h('div',{className:'stat-num',style:{color:'#fb923c',fontSize:'18px'}},fmt(stats.pending)),h('div',{className:'stat-label'},'Pending'))
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'Quick Actions'),
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}},
        h('button',{className:'btn btn-primary',onClick:()=>onNav('new-estimate')},'+ New Estimate'),
        h('button',{className:'btn btn-ghost',onClick:()=>onNav('estimates')},'View Estimates'),
        h('button',{className:'btn btn-ghost',onClick:()=>onNav('invoices')},'View Invoices'),
        h('button',{className:'btn btn-ghost',onClick:()=>onNav('customers')},'Customers')
      )
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'The Mailbox Repair CO'),
      h('div',{style:{fontSize:13,color:'#64748b',lineHeight:1.6}},
        '📍 DFW Metroplex, Texas',h('br',null),
        '🔧 Insurance Claim Specialists',h('br',null),
        '⭐ Mailbox Repair & Replacement'
      )
    )
  );
}

// ── ESTIMATE FORM ─────────────────────────────────────────────────────────
function EstimateForm({estimate,onSave,onBack}){
  const [form,setForm]=useState(estimate||{
    number:'EST-'+Date.now().toString().slice(-4),
    date:today(),status:'Draft',
    customer_name:'',customer_phone:'',customer_email:'',customer_address:'',
    items:[{id:uid(),description:'',qty:1,unit:'job',price:'',notes:''}],
    notes:'',tax_rate:0,
  });
  const [saving,setSaving]=useState(false);
  const [showPriceList,setShowPriceList]=useState(false);
  const [prices,setPrices]=useState([]);
  const [customers,setCustomers]=useState([]);
  const [showCusts,setShowCusts]=useState(false);

  useEffect(()=>{
    sb.from('line_item_templates').select('*').then(r=>setPrices(r.data&&r.data.length?r.data:DEFAULT_PRICES));
    sb.from('customers').select('*').order('name').then(r=>setCustomers(r.data||[]));
  },[]);

  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const setItem=(i,k,v)=>setForm(f=>{const items=[...f.items];items[i]={...items[i],[k]:v};return{...f,items}});
  const addItem=()=>setForm(f=>({...f,items:[...f.items,{id:uid(),description:'',qty:1,unit:'job',price:'',notes:''}]}));
  const removeItem=i=>setForm(f=>({...f,items:f.items.filter((_,idx)=>idx!==i)}));
  const addFromPrice=p=>{setForm(f=>({...f,items:[...f.items,{id:uid(),description:p.description,qty:1,unit:p.unit,price:p.price,notes:''}]}));setShowPriceList(false)};
  const pickCustomer=c=>{setF('customer_name',c.name);setF('customer_phone',c.phone||'');setF('customer_email',c.email||'');setF('customer_address',(c.address||'')+(c.city?', '+c.city:''));setF('customer_id',c.id);setShowCusts(false)};

  const sub=calcSub(form.items);
  const tax=sub*(Number(form.tax_rate)||0)/100;
  const total=sub+tax;

  async function save(){
    setSaving(true);
    try{
      const data={...form};
      if(!data.customer_id){
        // auto-create customer
        const exists=customers.find(c=>c.name===data.customer_name);
        if(!exists&&data.customer_name){
          const {data:nc}=await sb.from('customers').insert({name:data.customer_name,phone:data.customer_phone,email:data.customer_email,address:data.customer_address}).select().single();
          if(nc) data.customer_id=nc.id;
        } else if(exists){
          data.customer_id=exists.id;
        }
      }
      let result;
      if(data.id){
        result=await sb.from('estimates').update(data).eq('id',data.id).select().single();
      } else {
        result=await sb.from('estimates').insert(data).select().single();
      }
      if(result.error) throw result.error;
      onSave(result.data);
    } catch(e){
      alert('Error saving: '+e.message);
    }
    setSaving(false);
  }

  return h('div',{className:'content'},
    h('div',{className:'section-header'},
      h('button',{className:'btn btn-ghost btn-sm',onClick:onBack},'← Back'),
      h('h2',{className:'section-title'},form.id?'Edit Estimate':'New Estimate')
    ),

    // Customer section
    h('div',{className:'card'},
      h('div',{className:'section-header'},
        h('div',{className:'card-title',style:{margin:0}},'Customer'),
        customers.length>0&&h('button',{className:'btn btn-ghost btn-sm',onClick:()=>setShowCusts(true)},'Pick Saved')
      ),
      h('div',{className:'form-group'},h('label',{className:'label'},'Name'),h('input',{className:'input',value:form.customer_name,onChange:e=>setF('customer_name',e.target.value),placeholder:'Customer name'})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Phone'),h('input',{className:'input',type:'tel',value:form.customer_phone,onChange:e=>setF('customer_phone',e.target.value),placeholder:'(817) 555-0000'})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Email'),h('input',{className:'input',type:'email',value:form.customer_email,onChange:e=>setF('customer_email',e.target.value),placeholder:'email@example.com'})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Address'),h('input',{className:'input',value:form.customer_address,onChange:e=>setF('customer_address',e.target.value),placeholder:'123 Main St, Dallas, TX'}))
    ),

    // Details
    h('div',{className:'card'},
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}),
      h('div',{className:'form-group'},h('label',{className:'label'},'Estimate #'),h('input',{className:'input',value:form.number,onChange:e=>setF('number',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Date'),h('input',{className:'input',type:'date',value:form.date,onChange:e=>setF('date',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Status'),
        h('select',{className:'input',value:form.status,onChange:e=>setF('status',e.target.value)},
          ['Draft','Sent','Approved','Declined'].map(s=>h('option',{key:s,value:s},s))
        )
      )
    ),

    // Line items
    h('div',{className:'card'},
      h('div',{className:'section-header'},
        h('div',{className:'card-title',style:{margin:0}},'Line Items'),
        h('div',{style:{display:'flex',gap:6}},
          h('button',{className:'btn btn-ghost btn-sm',onClick:()=>setShowPriceList(true)},'Price List'),
          h('button',{className:'btn btn-ghost btn-sm',onClick:addItem},'+ Add')
        )
      ),
      form.items.map((item,i)=>h('div',{key:item.id,style:{borderBottom:'1px solid #1e3a5f',paddingBottom:10,marginBottom:10}},
        h('div',{className:'line-item-row'},
          h('input',{className:'input',placeholder:'Description',value:item.description,onChange:e=>setItem(i,'description',e.target.value)}),
          h('input',{className:'input',placeholder:'Qty',type:'number',value:item.qty,onChange:e=>setItem(i,'qty',e.target.value)}),
          h('input',{className:'input',placeholder:'Unit',value:item.unit,onChange:e=>setItem(i,'unit',e.target.value)}),
          h('input',{className:'input',placeholder:'Price',type:'number',value:item.price,onChange:e=>setItem(i,'price',e.target.value)}),
          h('button',{className:'btn btn-danger btn-sm',onClick:()=>removeItem(i),style:{padding:'6px 8px'}},'×')
        ),
        h('input',{className:'input',placeholder:'Notes (optional)',value:item.notes||'',onChange:e=>setItem(i,'notes',e.target.value),style:{marginTop:4,fontSize:12}})
      )),
      h('div',{style:{textAlign:'right',fontSize:13,color:'#64748b'}},
        h('div',null,'Subtotal: ',h('strong',{style:{color:'#e2e8f0'}},fmt(sub))),
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'flex-end',gap:8,marginTop:4}},
          'Tax: ',
          h('input',{className:'input',type:'number',value:form.tax_rate,onChange:e=>setF('tax_rate',e.target.value),style:{width:60,textAlign:'center'}}),
          '%'
        ),
        h('div',{style:{marginTop:6,fontSize:18,color:'#34d399',fontWeight:700}},'Total: '+fmt(total))
      )
    ),

    h('div',{className:'card'},
      h('div',{className:'card-title'},'Notes'),
      h('textarea',{className:'input',rows:3,value:form.notes,onChange:e=>setF('notes',e.target.value),placeholder:'Job notes, special instructions...'})
    ),

    h('button',{className:'btn btn-primary btn-block',onClick:save,disabled:saving},saving?'Saving...':'Save Estimate'),
    h('div',{style:{height:20}}),

    // Pick customer modal
    showCusts&&h('div',{className:'modal-overlay',onClick:()=>setShowCusts(false)},
      h('div',{className:'modal',onClick:e=>e.stopPropagation()},
        h('div',{className:'modal-title'},'Pick Customer'),
        customers.map(c=>h('div',{key:c.id,className:'list-item',onClick:()=>pickCustomer(c)},
          h('div',null,h('div',{className:'list-item-title'},c.name),h('div',{className:'list-item-sub'},c.phone))
        ))
      )
    ),

    // Price list modal
    showPriceList&&h('div',{className:'modal-overlay',onClick:()=>setShowPriceList(false)},
      h('div',{className:'modal',onClick:e=>e.stopPropagation()},
        h('div',{className:'modal-title'},'Price List'),
        prices.map(p=>h('div',{key:p.id,className:'list-item',onClick:()=>addFromPrice(p)},
          h('div',null,h('div',{className:'list-item-title'},p.description),h('div',{className:'list-item-sub'},p.unit)),
          h('div',{className:'list-item-amount'},fmt(p.price))
        ))
      )
    )
  );
}

// ── ESTIMATE DETAIL ───────────────────────────────────────────────────────
function EstimateDetail({id,onBack,onEdit,onConvert}){
  const [est,setEst]=useState(null);
  const [tab,setTab]=useState('details');
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    sb.from('estimates').select('*').eq('id',id).single().then(r=>{setEst(r.data);setLoading(false)});
  },[id]);

  if(loading||!est) return h('div',{className:'content'},h('div',{className:'loading'},'Loading...'));

  const sub=calcSub(est.items||[]);
  const tax=sub*(Number(est.tax_rate)||0)/100;
  const total=sub+tax;
  const shareUrl='https://mailboxrepairco.github.io/mbrc-estimator/view.html?id='+est.id;

  const sendSMS=()=>window.open('sms:'+est.customer_phone+'?body=Hi '+est.customer_name+', your estimate from The Mailbox Repair CO is ready. Total: '+fmt(total)+'. View here: '+shareUrl);

// ── INVOICE FORM ──────────────────────────────────────────────────────────
function InvoiceForm({invoice,estimate,onSave,onBack}){
  const base=estimate?{
    number:'INV-'+Date.now().toString().slice(-4),
    date:today(),
    due_date:'',
    status:'Unpaid',
    customer_name:estimate.customer_name,customer_phone:estimate.customer_phone,
    customer_email:estimate.customer_email,customer_address:estimate.customer_address,
    customer_id:estimate.customer_id,
    items:estimate.items,notes:estimate.notes,tax_rate:estimate.tax_rate,
    estimate_id:estimate.id,estimate_number:estimate.number,
    payment_link:''
  }:invoice;

  const [form,setForm]=useState(base||{
    number:'INV-'+Date.now().toString().slice(-4),date:today(),due_date:'',status:'Unpaid',
    customer_name:'',customer_phone:'',customer_email:'',customer_address:'',
    items:[{id:uid(),description:'',qty:1,unit:'job',price:'',notes:''}],
    notes:'',tax_rate:0,payment_link:''
  });
  const [saving,setSaving]=useState(false);

  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  const sub=calcSub(form.items);
  const tax=sub*(Number(form.tax_rate)||0)/100;
  const total=sub+tax;

  async function save(){
    setSaving(true);
    try{
      let result;
      if(form.id){
        result=await sb.from('invoices').update(form).eq('id',form.id).select().single();
      } else {
        result=await sb.from('invoices').insert(form).select().single();
        if(estimate){
          await sb.from('estimates').update({status:'Approved',invoice_id:result.data.id}).eq('id',estimate.id);
        }
      }
      if(result.error) throw result.error;
      onSave(result.data);
    } catch(e){alert('Error: '+e.message);}
    setSaving(false);
  }

  return h('div',{className:'content'},
    h('div',{className:'section-header'},
      h('button',{className:'btn btn-ghost btn-sm',onClick:onBack},'← Back'),
      h('h2',{className:'section-title'},form.id?'Edit Invoice':'New Invoice')
    ),
    estimate&&h('div',{className:'alert alert-info'},'Converting from estimate '+estimate.number),

    h('div',{className:'card'},
      h('div',{className:'form-group'},h('label',{className:'label'},'Customer'),h('input',{className:'input',value:form.customer_name,onChange:e=>setF('customer_name',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Phone'),h('input',{className:'input',type:'tel',value:form.customer_phone,onChange:e=>setF('customer_phone',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Email'),h('input',{className:'input',type:'email',value:form.customer_email,onChange:e=>setF('customer_email',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Invoice #'),h('input',{className:'input',value:form.number,onChange:e=>setF('number',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Due Date'),h('input',{className:'input',type:'date',value:form.due_date,onChange:e=>setF('due_date',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Status'),
        h('select',{className:'input',value:form.status,onChange:e=>setF('status',e.target.value)},
          ['Unpaid','Paid','Overdue'].map(s=>h('option',{key:s,value:s},s))
        )
      ),
      h('div',{className:'form-group'},h('label',{className:'label'},'Payment Link (Square/PayPal/Cash App)'),h('input',{className:'input',value:form.payment_link||'',onChange:e=>setF('payment_link',e.target.value),placeholder:'https://...'}))
    ),

    h('div',{className:'card'},
      h('div',{className:'card-title'},'Line Items'),
      (form.items||[]).map((item,i)=>h('div',{key:item.id||i,style:{borderBottom:'1px solid #1e3a5f',paddingBottom:8,marginBottom:8}},
        h('div',{className:'line-item-row'},
          h('input',{className:'input',placeholder:'Description',value:item.description,onChange:e=>{const items=[...form.items];items[i]={...items[i],description:e.target.value};setF('items',items)}}),
          h('input',{className:'input',placeholder:'Qty',type:'number',value:item.qty,onChange:e=>{const items=[...form.items];items[i]={...items[i],qty:e.target.value};setF('items',items)}}),
          h('input',{className:'input',placeholder:'Unit',value:item.unit,onChange:e=>{const items=[...form.items];items[i]={...items[i],unit:e.target.value};setF('items',items)}}),
          h('input',{className:'input',placeholder:'$',type:'number',value:item.price,onChange:e=>{const items=[...form.items];items[i]={...items[i],price:e.target.value};setF('items',items)}}),
          h('button',{className:'btn btn-danger btn-sm',onClick:()=>setF('items',form.items.filter((_,idx)=>idx!==i)),style:{padding:'6px 8px'}},'×')
        )
      )),
      h('button',{className:'btn btn-ghost btn-sm btn-block',onClick:()=>setF('items',[...form.items,{id:uid(),description:'',qty:1,unit:'job',price:'',notes:''}])},'+Add Item'),
      h('div',{style:{textAlign:'right',marginTop:8},fontSize:13},
        h('div',{style:{color:'#64748b'}},'Subtotal: '+fmt(sub)),
        tax>0&&h('div',{style:{color:'#64748b'}},'Tax ('+form.tax_rate+'%): '+fmt(tax)),
        h('div',{style:{fontSize:20,fontWeight:700,color:'#34d399'}},'Total: '+fmt(total))
      )
    ),

    h('div',{className:'card'},
      h('div',{className:'card-title'},'Notes'),
      h('textarea',{className:'input',rows:3,value:form.notes||'',onChange:e=>setF('notes',e.target.value)})
    ),

    h('button',{className:'btn btn-primary btn-block',onClick:save,disabled:saving},saving?'Saving...':'Save Invoice')
  );
}

      h('div',{className:'form-group'},h('label',{className:'label'},'Stage'),
        h('select',{className:'input',value:form.stage||'Lead',onChange:e=>setF('stage',e.target.value)},
          ['Lead','Contacted','Quoted','Approved','In Progress','Completed'].map(s=>h('option',{key:s,value:s},s))
        )
      ),
      h('div',{className:'form-group'},h('label',{className:'label'},'Lead Source'),h('input',{className:'input',value:form.lead_source||'',onChange:e=>setF('lead_source',e.target.value),placeholder:'Google, Referral, Insurance, etc.'})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Follow-up Date'),h('input',{className:'input',type:'date',value:form.follow_up_date||'',onChange:e=>setF('follow_up_date',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Notes'),h('textarea',{className:'input',rows:3,value:form.notes||'',onChange:e=>setF('notes',e.target.value)}))
    ),
    h('button',{className:'btn btn-primary btn-block',onClick:save,disabled:saving},saving?'Saving...':'Save Customer')
  );

  return h('div',{className:'content'},
    h('div',{className:'section-header'},
      h('h2',{className:'section-title'},'Customers ('+customers.length+')'),
      h('button',{className:'btn btn-primary btn-sm',onClick:()=>{setForm({name:'',phone:'',email:'',address:'',city:'',state:'TX',notes:'',stage:'Lead',lead_source:'',follow_up_date:''});setShowForm(true)}},'+ New')
    ),
    customers.length===0?h('div',{className:'empty'},h('div',{className:'empty-icon'},'👥'),h('div',null,'No customers yet')):
    customers.map(c=>h('div',{key:c.id,className:'list-item',onClick:()=>{setForm(c);setShowForm(true)}},
      h('div',null,
        h('div',{className:'list-item-title'},c.name),
        h('div',{className:'list-item-sub'},c.phone),
        c.stage&&h('span',{className:'badge badge-sent',style:{marginTop:4}},c.stage)
      ),
      h('div',{style:{fontSize:12,color:'#64748b',textAlign:'right'}},c.lead_source||'')
    ))
  );
}

// ── REPORTS ───────────────────────────────────────────────────────────────
function Reports(){
  const [data,setData]=useState(null);
  const [loading,setLoading]=useState(true);

  useEffect(()=>{
    async function load(){
      const [invs,ests,custs]=await Promise.all([
        sb.from('invoices').select('*'),
        sb.from('estimates').select('*'),
        sb.from('customers').select('*')
      ]);
      const paidInvs=(invs.data||[]).filter(i=>i.status==='Paid');
      const unpaidInvs=(invs.data||[]).filter(i=>i.status!=='Paid');
      const revenue=paidInvs.reduce((a,i)=>a+calcTotal(i.items||[],i.tax_rate),0);
      const pending=unpaidInvs.reduce((a,i)=>a+calcTotal(i.items||[],i.tax_rate),0);
      // Monthly chart - last 6 months
      const months=[];
      for(let i=5;i>=0;i--){
        const d=new Date();d.setMonth(d.getMonth()-i);
        const m=d.toISOString().slice(0,7);
        const label=d.toLocaleString('default',{month:'short'});
        const amt=paidInvs.filter(inv=>inv.created_at&&inv.created_at.startsWith(m)).reduce((a,inv)=>a+calcTotal(inv.items||[],inv.tax_rate),0);
        months.push({label,amt});
      }
      // Top customers
      const custRev={};
      paidInvs.forEach(i=>{if(i.customer_name)custRev[i.customer_name]=(custRev[i.customer_name]||0)+calcTotal(i.items||[],i.tax_rate)});
      const topCustomers=Object.entries(custRev).sort((a,b)=>b[1]-a[1]).slice(0,5);
      // Lead sources
      const srcMap={};
      (custs.data||[]).forEach(c=>{if(c.lead_source)srcMap[c.lead_source]=(srcMap[c.lead_source]||0)+1});
      const leadSources=Object.entries(srcMap).sort((a,b)=>b[1]-a[1]);
      setData({revenue,pending,months,topCustomers,leadSources,totalInvoices:(invs.data||[]).length,totalEstimates:(ests.data||[]).length,totalCustomers:(custs.data||[]).length});
      setLoading(false);
    }
    load();
  },[]);

  if(loading) return h('div',{className:'content'},h('div',{className:'loading'},'Loading...'));
  if(!data) return null;

  const maxAmt=Math.max(...data.months.map(m=>m.amt),1);

  return h('div',{className:'content'},
    h('h2',{className:'section-title',style:{marginBottom:12}},'Revenue Reports'),
    h('div',{className:'stats-grid'},
      h('div',{className:'stat-box'},h('div',{className:'stat-num',style:{fontSize:16}},fmt(data.revenue)),h('div',{className:'stat-label'},'Total Revenue')),
      h('div',{className:'stat-box'},h('div',{className:'stat-num',style:{fontSize:16,color:'#fb923c'}},fmt(data.pending)),h('div',{className:'stat-label'},'Pending')),
      h('div',{className:'stat-box'},h('div',{className:'stat-num'},data.totalInvoices),h('div',{className:'stat-label'},'Invoices')),
      h('div',{className:'stat-box'},h('div',{className:'stat-num'},data.totalCustomers),h('div',{className:'stat-label'},'Customers'))
    ),
    h('div',{className:'card'},
      h('div',{className:'card-title'},'Monthly Revenue (6 mo)'),
      h('div',{className:'chart-bar-wrap'},
        data.months.map(m=>h('div',{key:m.label,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center'}},
          h('div',{style:{width:'100%',background:'#2563eb',borderRadius:'4px 4px 0 0',height:Math.max((m.amt/maxAmt)*70,2)+'px'}}),
          h('div',{className:'chart-label'},m.label),
          h('div',{style:{fontSize:9,color:'#3b82f6',textAlign:'center'}},m.amt>0?'$'+Math.round(m.amt):'')
        ))
      )
    ),
    data.topCustomers.length>0&&h('div',{className:'card'},
      h('div',{className:'card-title'},'Top Customers'),
      data.topCustomers.map(([name,amt])=>h('div',{key:name,style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #1e3a5f'}},
        h('div',{style:{fontSize:13}},name),
        h('div',{style:{fontSize:13,color:'#34d399',fontWeight:600}},fmt(amt))
      ))
    ),
    data.leadSources.length>0&&h('div',{className:'card'},
      h('div',{className:'card-title'},'Lead Sources'),
      data.leadSources.map(([src,cnt])=>h('div',{key:src,style:{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid #1e3a5f'}},
        h('div',{style:{fontSize:13}},src),
        h('div',{style:{fontSize:13,color:'#60a5fa',fontWeight:600}},cnt+' leads')
      ))
    )
  );
}

// ── PRICE LIST MANAGER ────────────────────────────────────────────────────
function PriceListManager(){
  const [prices,setPrices]=useState([]);
  const [loading,setLoading]=useState(true);
  const [showForm,setShowForm]=useState(false);
  const [form,setForm]=useState({description:'',unit:'job',price:''});
  const [saving,setSaving]=useState(false);

  useEffect(()=>{load()},[]);
  function load(){sb.from('line_item_templates').select('*').order('description').then(r=>{setPrices(r.data&&r.data.length?r.data:DEFAULT_PRICES);setLoading(false)})}
  const setF=(k,v)=>setForm(f=>({...f,[k]:v}));
  async function save(){
    setSaving(true);
    try{
      if(form.id){
        await sb.from('line_item_templates').update(form).eq('id',form.id);
      } else {
        await sb.from('line_item_templates').insert({...form,id:uid()});
      }
      setShowForm(false);setForm({description:'',unit:'job',price:''});load();
    }catch(e){alert(e.message);}
    setSaving(false);
  }
  async function del(id){
    if(!confirm('Delete this item?'))return;
    await sb.from('line_item_templates').delete().eq('id',id);
    load();
  }

  if(loading) return h('div',{className:'content'},h('div',{className:'loading'},'Loading...'));

  if(showForm) return h('div',{className:'content'},
    h('div',{className:'section-header'},
      h('button',{className:'btn btn-ghost btn-sm',onClick:()=>setShowForm(false)},'← Back'),
      h('h2',{className:'section-title'},form.id?'Edit Item':'New Price Item')
    ),
    h('div',{className:'card'},
      h('div',{className:'form-group'},h('label',{className:'label'},'Description'),h('input',{className:'input',value:form.description,onChange:e=>setF('description',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Unit'),h('input',{className:'input',value:form.unit,onChange:e=>setF('unit',e.target.value)})),
      h('div',{className:'form-group'},h('label',{className:'label'},'Price ($)'),h('input',{className:'input',type:'number',value:form.price,onChange:e=>setF('price',e.target.value)}))
    ),
    h('button',{className:'btn btn-primary btn-block',onClick:save,disabled:saving},saving?'Saving...':'Save')
  );

  return h('div',{className:'content'},
    h('div',{className:'section-header'},
      h('h2',{className:'section-title'},'Price List'),
      h('button',{className:'btn btn-primary btn-sm',onClick:()=>{setForm({description:'',unit:'job',price:''});setShowForm(true)}},'+ Add')
    ),
    prices.map(p=>h('div',{key:p.id,className:'list-item'},
      h('div',null,h('div',{className:'list-item-title'},p.description),h('div',{className:'list-item-sub'},p.unit)),
      h('div',{style:{display:'flex',gap:6,alignItems:'center'}},
        h('div',{className:'list-item-amount'},fmt(p.price)),
        h('button',{className:'btn btn-ghost btn-sm',onClick:()=>{setForm(p);setShowForm(true)}},'Edit'),
        h('button',{className:'btn btn-danger btn-sm',onClick:()=>del(p.id)},'×')
      )
    ))
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────
function App(){
  const [tab,setTab]=useState('dashboard');
  const [view,setView]=useState(null); // {type, id, data}

  const navigate=(screen,data)=>{
    if(screen==='new-estimate'){setView({type:'new-estimate'});return}
    setTab(screen);setView(null);
  };

  // Handle views that override tabs
  if(view){
    if(view.type==='new-estimate')
      return h('div',{className:'app'},
        h(EstimateForm,{onSave:(est)=>{setView({type:'estimate-detail',id:est.id})},onBack:()=>setView(null)})
      );
    if(view.type==='edit-estimate')
      return h('div',{className:'app'},
        h(EstimateForm,{estimate:view.data,onSave:(est)=>{setView({type:'estimate-detail',id:est.id})},onBack:()=>setView(null)})
      );
    if(view.type==='estimate-detail')
      return h('div',{className:'app'},
        h(EstimateDetail,{
          id:view.id,
          onBack:()=>setView(null),
          onEdit:()=>{
            sb.from('estimates').select('*').eq('id',view.id).single().then(r=>{
              if(r.data)setView({type:'edit-estimate',data:r.data});
            });
          },
          onConvert:(est)=>setView({type:'new-invoice',data:est})
        })
      );
    if(view.type==='new-invoice')
      return h('div',{className:'app'},
        h(InvoiceForm,{estimate:view.data,onSave:(inv)=>{setView({type:'invoice-detail',id:inv.id})},onBack:()=>setView(null)})
      );
    if(view.type==='edit-invoice')
      return h('div',{className:'app'},
        h(InvoiceForm,{invoice:view.data,onSave:(inv)=>{setView({type:'invoice-detail',id:inv.id})},onBack:()=>setView(null)})
      );
    if(view.type==='invoice-detail')
      return h('div',{className:'app'},
        h(InvoiceDetail,{
          id:view.id,
          onBack:()=>setView(null),
          onEdit:()=>{
            sb.from('invoices').select('*').eq('id',view.id).single().then(r=>{
              if(r.data)setView({type:'edit-invoice',data:r.data});
            });
          }
        })
      );
  }

  const tabs=[
    {id:'dashboard',label:'🏠 Home'},
    {id:'estimates',label:'📋 Estimates'},
    {id:'invoices',label:'🧾 Invoices'},
    {id:'customers',label:'👥 Customers'},
    {id:'reports',label:'📊 Reports'},
    {id:'pricelist',label:'💲 Prices'},
  ];

  return h('div',{className:'app'},
    h('nav',{className:'nav'},
      h('div',{className:'nav-top'},
        h('div',{className:'nav-logo'},'MBRC',h('span',null,'The Mailbox Repair CO'))
      ),
      h('div',{className:'nav-tabs'},
        tabs.map(t=>h('button',{key:t.id,className:'nav-tab'+(tab===t.id?' active':''),onClick:()=>{setTab(t.id);setView(null)}},t.label))
      )
    ),
    tab==='dashboard'&&h(Dashboard,{onNav:navigate}),
    tab==='estimates'&&h(EstimatesList,{onNew:()=>setView({type:'new-estimate'}),onSelect:(id)=>setView({type:'estimate-detail',id})}),
    tab==='invoices'&&h(InvoicesList,{onNew:()=>setView({type:'new-invoice',data:null}),onSelect:(id)=>setView({type:'invoice-detail',id})}),
    tab==='customers'&&h(Customers,null),
    tab==='reports'&&h(Reports,null),
    tab==='pricelist'&&h(PriceListManager,null)
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));
</script>
